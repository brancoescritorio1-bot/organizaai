<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="305" y1="150" x2="358" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47b0ff"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
  </defs>

  <!-- Obsidian squircle matching OrganizaAI aesthetic -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8"/>

  <!-- Precision open 'O' ring -->
  <path
    d="M 360 236 A 106 106 0 1 1 276 152"
    stroke="#ffffff"
    stroke-width="48"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Centered Apple-blue AI node along the orbital ring -->
  <circle cx="331" cy="181" r="28" fill="url(#blueGrad)"/>
</svg>
